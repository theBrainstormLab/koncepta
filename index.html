<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var dark = stored
          ? stored === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/DynaPuff.woff2"
      crossorigin
    />
    <title>koncepta - community notes with AI help</title>
    <meta
      name="description"
      content="Community-written notes with an AI chat alongside each one. Built for FYUGP students at Calicut University, open to everyone."
    />
    <link rel="canonical" href="https://koncepta.netlify.app/" />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="koncepta - community notes with AI help"
    />
    <meta
      property="og:description"
      content="Community-written notes with an AI chat alongside each one."
    />
    <meta property="og:url" content="https://koncepta.netlify.app/" />
    <meta
      property="og:image"
      content="https://koncepta.netlify.app/favicon.png"
    />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="koncepta - community notes with AI help"
    />
    <meta
      name="twitter:description"
      content="Community-written notes with an AI chat alongside each one."
    />
    <meta
      name="twitter:image"
      content="https://koncepta.netlify.app/favicon.png"
    />

    <meta
      name="theme-color"
      content="#fafaf8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#2b2b2e"
      media="(prefers-color-scheme: dark)"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
